<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | ShapeJam</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #231F20;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        touch-action: none;
        user-select: none;
      }

      #unity-canvas {
        display: block;
        width: min(100vw, 56.25vh);
        height: min(100vh, 177.7778vw);
        max-width: 100vw;
        max-height: 100vh;
        background: #231F20;
      }

      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }

        #unity-canvas {
          width: min(100vw, 56.25dvh);
          height: min(100dvh, 177.7778vw);
          max-height: 100dvh;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
    <script src="Build/ShapeMatch_WebGL.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/ShapeMatch_WebGL.data",
        frameworkUrl: "Build/ShapeMatch_WebGL.framework.js",
        codeUrl: "Build/ShapeMatch_WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ShapeJam",
        productVersion: "0.1",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      });
    </script>
  </body>
</html>
